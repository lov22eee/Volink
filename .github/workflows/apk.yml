name: Android APK (test build)
# Builds the Android app (frontend/src/app via Capacitor) as a debug APK to install on a phone for testing.
# Download it from the run's "Artifacts" (volink-apk). Not a store release: it is signed with this run's debug key.
on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the app screens
        working-directory: frontend
        env:
          # Which code this APK runs: shown at the bottom of 설정 and in the file name.
          VITE_APP_VERSION: '0.6'
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
          # The server the app calls (the public site). Override with the repository variable VOLINK_SITE.
          VITE_API_BASE: ${{ vars.VOLINK_SITE || 'https://3-104-31-169.sslip.io' }}
          # Kakao Maps JavaScript key (public, domain-restricted: register https://localhost for the app). Empty = drawn map.
          VITE_KAKAO_JS_KEY: ${{ vars.VOLINK_KAKAO_JS_KEY || secrets.VOLINK_KAKAO_JS_KEY }}
          # Firebase app config (repository secret, from the Firebase console). Present = phone push in this build.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            export VITE_PUSH=1
            echo "Firebase: on (phone push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firebase: off (no GOOGLE_SERVICES_JSON secret)" >> "$GITHUB_STEP_SUMMARY"
          fi
          export VITE_COMMIT="${VITE_COMMIT:0:7}"
          echo "APK: 0.6 build ${VITE_BUILD_NUMBER} · commit ${VITE_COMMIT} · branch ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          npm ci
          npm run build:app
          npx cap sync android
      # Keep one debug signing key between runs so a new test APK installs over the previous one
      # (a new key each run makes Android refuse the update) and Firebase sees the same fingerprint.
      # Test builds only; never a release key. Gradle signs with it through VOLINK_DEBUG_KEYSTORE.
      # Saved only from main: a branch can read main's key but never makes its own lasting one.
      - id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/volink-keys/debug.keystore
          key: volink-debug-keystore-v2
      - name: Make the debug key once
        run: |
          mkdir -p ~/volink-keys
          if [ ! -s ~/volink-keys/debug.keystore ]; then
            keytool -genkeypair -keystore ~/volink-keys/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build the APK
        working-directory: frontend/android
        env:
          VOLINK_VERSION_CODE: ${{ github.run_number }}
          VOLINK_COMMIT: ${{ github.sha }}
        run: VOLINK_COMMIT="${VOLINK_COMMIT:0:7}" VOLINK_DEBUG_KEYSTORE="$HOME/volink-keys/debug.keystore" ./gradlew assembleDebug --no-daemon
      - if: github.ref == 'refs/heads/main' && steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/volink-keys/debug.keystore
          key: volink-debug-keystore-v2
      # Firebase (phone sign-in) asks for the app's signing fingerprints; they are public, not secrets.
      - name: Show the signing fingerprints (SHA-1 / SHA-256) for Firebase
        run: |
          set -o pipefail
          keytool -list -v -keystore ~/volink-keys/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1|SHA256' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the file
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "volink-0.6-${{ github.run_number }}-${GITHUB_SHA:0:7}.apk"
      # 한글 입력 비교용 (2026-11-06, 확인이 끝나면 지움): the same app with the old Capacitor setting android.captureInput on,
      # so the 진단 화면 (#/ime-lab) can be compared on the same phone. Not for use: install it only for that test.
      - name: Comparison APK with the old captureInput setting
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VOLINK_SITE || 'https://3-104-31-169.sslip.io' }}
          VITE_KAKAO_JS_KEY: ${{ vars.VOLINK_KAKAO_JS_KEY || secrets.VOLINK_KAKAO_JS_KEY }}
          VITE_APP_VERSION: '0.6'
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
          VITE_CAPTURE_INPUT: '1'
          VOLINK_VERSION_CODE: ${{ github.run_number }}
          VOLINK_COMMIT: ${{ github.sha }}
        run: |
          export VITE_COMMIT="${VITE_COMMIT:0:7}" VOLINK_COMMIT="${VOLINK_COMMIT:0:7}"
          if [ -s android/app/google-services.json ]; then export VITE_PUSH=1; fi
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.android.captureInput=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npm run build:app
          npx cap sync android
          (cd android && VOLINK_DEBUG_KEYSTORE="$HOME/volink-keys/debug.keystore" ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk "../volink-0.6-${{ github.run_number }}-${VOLINK_COMMIT}-capture-compare.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: volink-apk
          path: volink-0.6-*.apk
          retention-days: 14
