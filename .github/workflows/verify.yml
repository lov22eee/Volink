name: Verify development foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare local environment and dependencies
        run: |
          ./scripts/setup-env.sh
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: MySQL integration tests
        run: ./scripts/backend.sh -B test
      - name: Frontend type check and build
        working-directory: frontend
        run: npm run build
      - name: Start application and check database-backed requests
        run: |
          ./scripts/start-dev.sh
          ./scripts/check-dev.sh
      - name: Browser scenarios
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-test-results
          path: |
            frontend/playwright-report/
            backend/target/surefire-reports/
      - name: Stop services without deleting database data
        if: always()
        run: |
          ./scripts/stop-dev.sh
          docker compose stop db
