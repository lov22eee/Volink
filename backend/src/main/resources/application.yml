spring:
  application:
    name: volink-api
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:volink}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:volink}
    password: ${MYSQL_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
