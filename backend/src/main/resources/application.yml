spring:
  application:
    name: volink-api
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:volink}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:volink}
    password: ${MYSQL_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
volink:
  auth:
    # Base64 HS256 key of 32+ bytes. Empty = random per process (local development only).
    jwt-secret: ${JWT_SECRET:}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  kakao:
    # Kakao Local REST API key (server only; never a VITE_ variable). Empty = place search falls back to admin-entered places.
    rest-key: ${KAKAO_REST_KEY:}
  oauth:
    # Kakao / Google login (personal members only). Empty client id = that button says "준비 중".
    # Register the redirect URI {base}/api/auth/oauth/kakao/callback (and …/google/callback) with each provider.
    kakao-client-id: ${KAKAO_LOGIN_CLIENT_ID:}
    kakao-client-secret: ${KAKAO_LOGIN_CLIENT_SECRET:}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Kakao app admin key (server only): unlinks a member's Kakao login when they withdraw. Empty = not unlinked.
    kakao-admin-key: ${KAKAO_ADMIN_KEY:}
    # e.g. https://volink.example.com. Empty = taken from the request (works behind the Vite proxy in development).
    redirect-base: ${OAUTH_REDIRECT_BASE:}
  app:
    # Android app (Capacitor) origin that may call /api across sites and keeps its refresh token itself.
    origins: ${APP_ORIGINS:https://localhost}
    # Package name the Kakao / Google login hands the result back to (volink:// link).
    package: com.volink.app
  firebase:
    # Firebase service account JSON file on the server only (phone push). Empty = no push is sent.
    service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}
  data-go-kr:
    # data.go.kr "일반 인증키 (Decoding)" for 1365 봉사참여정보서비스. Empty = 1365 programs are not shown.
    key: ${DATA_GO_KR_KEY:}
  demo:
    # Local/demo environment only: password for the 11 demo accounts. Empty = no demo accounts are created.
    account-password: ${DEMO_ACCOUNT_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: dev | test
volink:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
---
spring:
  config:
    activate:
      on-profile: test
volink:
  scheduler:
    # Tests call ParticipationService.expireDue() directly instead of waiting for the minute timer.
    enabled: false
