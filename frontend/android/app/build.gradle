apply plugin: 'com.android.application'

def record = project.hasProperty("volinkRecord") && project.property("volinkRecord") == "true"

android {
    namespace = "com.volink.app"
    buildFeatures { buildConfig = true }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.volink.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // GitHub Actions passes the run number so each APK installs over the previous one (same signing key).
        versionCode Integer.parseInt(System.getenv("VOLINK_VERSION_CODE") ?: "1")
        // Shown in Android 설정 > 애플리케이션 > Volink: 0.6-<commit> (the same commit as the bottom of the app's 설정).
        versionName "0.6-" + (System.getenv("VOLINK_COMMIT") ?: "local")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // QR links open this app (App Links): the public site's host, the same server as VITE_API_BASE.
        manifestPlaceholders = [appLinkHost: (System.getenv("VOLINK_APP_LINK_HOST") ?: "3-104-31-169.sslip.io"),
                                appLabel: record ? "Volink 녹화용" : "@string/title_activity_main"]
        // 녹화용 APK only (-PvolinkRecord=true, 2026-11-08): the 1365 window allows screen capture for a backup demo video.
        buildConfigField "boolean", "ALLOW_CAPTURE", record ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Test builds: one fixed debug key kept by GitHub Actions (VOLINK_DEBUG_KEYSTORE), so every new APK installs over
    // the previous one and Firebase knows the app's fingerprint. Never a release key.
    signingConfigs {
        debug {
            def keystore = System.getenv("VOLINK_DEBUG_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 종이 확인서 스캔하기 (2026-11-12): Google's on-device document scanner (Google Play services, no key).
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
